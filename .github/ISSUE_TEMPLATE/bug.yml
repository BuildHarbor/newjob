name: Bug report
description: Report a reproducible problem using fictional data.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and steps to reproduce. Remove personal data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, browser, Node version, Ollama model if relevant
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or errors
      description: Use fictional resumes; remove contacts, backups and credentials.
