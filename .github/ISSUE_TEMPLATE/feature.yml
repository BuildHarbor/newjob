name: Feature proposal
description: Suggest an improvement that fits a free local workspace.
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: User problem
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and tradeoffs
      description: Consider cost, privacy, accessibility and alternatives.
    validations:
      required: true
